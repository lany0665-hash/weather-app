name: Deploy Firestore Rules

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_PROJECT" ]; then echo "FIREBASE_PROJECT secret is not set"; exit 1; fi
          if [ -z "$FIREBASE_TOKEN" ]; then echo "FIREBASE_TOKEN secret is not set"; exit 1; fi
          echo "Deploying firestore.rules to $FIREBASE_PROJECT"
          firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --token "$FIREBASE_TOKEN"
